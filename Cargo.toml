[package]
name = "codex-acp"
version = "0.15.0"
edition = "2024"
authors = ["Zed <hi@zed.dev>"]
license = "Apache-2.0"
description = "An ACP-compatible coding agent powered by Codex"
repository = "https://github.com/zed-industries/codex-acp"
homepage = "https://github.com/zed-industries/codex-acp"

[[bin]]
name = "codex-acp"
path = "src/main.rs"

[lib]
doctest = false
name = "codex_acp"
path = "src/lib.rs"

[dependencies]
agent-client-protocol = { version = "=0.12.1", features = ["unstable"] }
anyhow = "1"
clap = "4"
codex-apply-patch = { path = "../codex/codex-rs/apply-patch" }
codex-arg0 = { path = "../codex/codex-rs/arg0" }
codex-config = { path = "../codex/codex-rs/config" }
codex-core = { path = "../codex/codex-rs/core" }
codex-exec-server = { path = "../codex/codex-rs/exec-server" }
codex-extension-api = { path = "../codex/codex-rs/ext/extension-api" }
codex-mcp = { path = "../codex/codex-rs/codex-mcp" }
codex-mcp-server = { path = "../codex/codex-rs/mcp-server" }
codex-models-manager = { path = "../codex/codex-rs/models-manager" }
codex-protocol = { path = "../codex/codex-rs/protocol" }
codex-login = { path = "../codex/codex-rs/login" }
codex-shell-command = { path = "../codex/codex-rs/shell-command" }
codex-utils-approval-presets = { path = "../codex/codex-rs/utils/approval-presets" }
codex-utils-cli = { path = "../codex/codex-rs/utils/cli" }
# Pin allocative to 0.3.4 because starlark_map 0.13.0 exposes hashbrown 0.14
# internals that need allocative's matching hashbrown implementation.
allocative = "=0.3.4"
diffy = { version = "0.5.0", features = ["std"] }
itertools = "0.14.0"
serde = { version = "1", features = ["derive"] }
# codex-cli depends on codex-tui, which enables serde_json/preserve_order; match
# that behavior here because it affects MCP keychain account hashing.
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
heck = "0.5.0"
unicode-segmentation = "1.11.0"
uuid = { version = "1", features = ["v4"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "132f5b39c862e3a970f731d709608b3e6276d5f6" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "9200079d3b54a1ff51072e24d81fd354f085156f" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3
